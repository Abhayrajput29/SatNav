name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e
        env:
          SATNAV_E2E_USE_SYSTEM_CHROME: "false"

      - name: Build production container
        run: docker build --tag satnav:ci .

      - name: Smoke-test production container
        shell: bash
        run: |
          docker run --detach --name satnav-ci --publish 127.0.0.1:3001:3000 satnav:ci
          trap 'docker rm --force satnav-ci >/dev/null 2>&1 || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3001/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs satnav-ci
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:3001/ >/dev/null
